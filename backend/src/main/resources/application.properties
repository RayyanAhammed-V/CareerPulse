# ============================================================
# Career Navigator - Spring Boot Application Properties
# ============================================================

spring.application.name=career-navigator-api

# Datasource configuration: Supports MySQL via env vars or persistent H2 fallback
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:h2:file:./data/careernavigator_db;AUTO_SERVER=TRUE}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:password}}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=true

# Server & Network Configuration
server.port=${PORT:8080}
frontend.url=${FRONTEND_URL:http://localhost:5173}

# JWT Configuration
jwt.secret=${JWT_SECRET:CareerNavigatorSuperSecretKeyWhichIsAtLeast32BytesLong2026}
jwt.expiration=${JWT_EXPIRATION:86400000}
