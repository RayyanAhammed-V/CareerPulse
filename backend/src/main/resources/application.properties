# ============================================================
# Career Navigator - Spring Boot Application Properties
# ============================================================

spring.application.name=career-navigator-api

# Datasource configuration: Supports MySQL via env vars or persistent H2 fallback
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:h2:file:./data/careernavigator_db;AUTO_SERVER=TRUE}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:password}}

# HikariCP Connection Pool Resilience (Prevents dropped / stale cloud DB connections)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=5000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# H2 Web Console (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Server & Network Configuration
server.port=${PORT:8080}
frontend.url=${FRONTEND_URL:http://localhost:5173}

# JWT Configuration
jwt.secret=${JWT_SECRET:CareerNavigatorSuperSecretKeyWhichIsAtLeast32BytesLong2026}
jwt.expiration=${JWT_EXPIRATION:86400000}
